name: AeroPA
options:
  bundleIdPrefix: com.cha0uki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your team to run on a device
packages:
  AeroPACore:
    path: .
targets:
  AeroPA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AeroPA/App
      - path: AeroPA/Views
      - path: AeroPA/Resources/Assets.xcassets
      # Folder references keep pack directory structure intact in the bundle.
      - path: AeroPA/Resources/Airlines
        type: folder
        buildPhase: resources
      - path: AeroPA/Resources/Shared
        type: folder
        buildPhase: resources
    dependencies:
      - package: AeroPACore
        product: AeroPACore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cha0uki.aeropa
        INFOPLIST_FILE: AeroPA/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
schemes:
  AeroPA:
    build:
      targets:
        AeroPA: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: AeroPACore/AeroPACoreTests
